name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: Run the complete local synthetic browser regression
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    # Covers install and quality:full on their own, plus the opt-in browser regression,
    # whose own 30-minute harness bound is the guard for that step.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run quality:full
      - name: Synthetic browser regression (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.browser
        run: npm run verify:redesign
