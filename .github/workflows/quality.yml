name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: Include the complete synthetic browser regression (3 independent shards); a version change runs it without this
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      full_browser: ${{ steps.changes.outputs.full_browser }}
      windows_sensitive: ${{ steps.changes.outputs.windows_sensitive }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            scripts/ci-changes.mjs
            scripts/change-classifier.mjs
          sparse-checkout-cone-mode: false
      - id: changes
        run: node scripts/ci-changes.mjs
        env:
          UIMORI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          UIMORI_BROWSER_INPUT: ${{ inputs.browser }}

  static:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ needs.changes.outputs.docs_only == 'true' && '0' || '1' }}
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --no-audit --no-fund
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run quality
      - if: needs.changes.outputs.docs_only == 'true'
        run: node -e "require('node:child_process').execFileSync('git', ['diff','--check',process.env.UIMORI_DIFF_BASE,'HEAD'], {stdio:'inherit'})"
        env:
          UIMORI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - if: needs.changes.outputs.docs_only == 'true'
        run: node scripts/check-documentation.mjs

  tests:
    name: tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci-vitest.mjs ${{ matrix.shard }}/4 --exclude-dist
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-vitest-${{ matrix.shard }}
          path: output/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  tests-pr:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci-vitest.mjs 1/1 --exclude-dist --impact-base "$UIMORI_IMPACT_BASE"
        env:
          UIMORI_IMPACT_BASE: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-vitest-1
          path: output/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  tooling:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.windows_sensitive == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # test:tooling owns its one build; do not build a second time here.
      - run: npm run test:tooling
      # Files, backups, child processes and the compiled server on the Windows quick-start platform.
      - run: npm run test:windows
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tooling-diagnostics
          path: output/tooling/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  linux-browser-core:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/ci-vitest.mjs 1/1 --dist-only
      - name: Install managed Chromium
        run: |
          npx playwright install --with-deps --no-shell chromium
          node --input-type=module -e "import { appendFileSync } from 'node:fs'; import { chromium } from '@playwright/test'; appendFileSync(process.env.GITHUB_ENV, 'UIMORI_BROWSER_PATH=' + chromium.executablePath() + '\n');"
      - run: npm run verify -- self-host
      - run: npm run verify -- browser-smoke
      - name: Reader recovery
        run: npm run verify -- all --grep READERREC
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-vitest-dist
          path: output/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-browser-core-diagnostics
          path: output/playwright/
          overwrite: true
          retention-days: 7

  browser-full:
    name: browser-full (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.full_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install managed Chromium
        run: |
          npx playwright install --with-deps --no-shell chromium
          node --input-type=module -e "import { appendFileSync } from 'node:fs'; import { chromium } from '@playwright/test'; appendFileSync(process.env.GITHUB_ENV, 'UIMORI_BROWSER_PATH=' + chromium.executablePath() + '\n');"
      - run: npm run verify -- all --shard ${{ matrix.shard }}/3
        env:
          UIMORI_CI_BROWSER_REPORT: output/ci/browser-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-browser-${{ matrix.shard }}
          path: output/ci/browser-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: browser-diagnostics-${{ matrix.shard }}
          path: output/playwright/
          overwrite: true
          retention-days: 7

  # Stable check name. Skips are accepted only for the declared docs/manual paths.
  quality:
    needs: [changes, static, tests, tests-pr, tooling, linux-browser-core, browser-full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/ci-summary.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check all required job outcomes
        run: node scripts/ci-summary.mjs jobs
        env:
          UIMORI_CI_NEEDS: ${{ toJSON(needs) }}
          UIMORI_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          UIMORI_FULL_BROWSER: ${{ needs.changes.outputs.full_browser }}
          UIMORI_WINDOWS_SENSITIVE: ${{ needs.changes.outputs.windows_sensitive }}
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.docs_only != 'true'
        with:
          pattern: ci-vitest-*
          path: output/collected
          merge-multiple: true
      - name: Verify complete, non-overlapping Vitest collection and summarize timings
        if: needs.changes.outputs.docs_only != 'true'
        run: node scripts/ci-summary.mjs vitest output/collected
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.full_browser == 'true'
        with:
          pattern: ci-browser-*
          path: output/collected
          merge-multiple: true
      - name: Verify complete browser collection
        if: needs.changes.outputs.full_browser == 'true'
        run: node scripts/ci-summary.mjs browser output/collected
