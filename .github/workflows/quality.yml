name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: Run the complete local synthetic browser regression
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: npm
      - id: changes
        run: node scripts/ci-changes.mjs
        env:
          UIMORI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run quality:full
      - if: steps.changes.outputs.docs_only == 'true'
        run: git diff --check $env:UIMORI_DIFF_BASE HEAD
        env:
          UIMORI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    needs: quality
    runs-on: windows-latest
    # Includes installation and a fresh build; the regression itself is bounded at 30 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run verify:browser
