server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # The application validates the original Host against NR_PUBLIC_ORIGIN.
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # Archive import is 64 MiB; Fastify retains smaller route-specific limits.
    client_max_body_size 64m;
    # Avoid logging chat IDs, resource paths and query strings by default.
    access_log off;

    # Docker DNS is re-resolved when app is recreated during an update.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $uimori_upstream app:4310;
        proxy_pass http://$uimori_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection "";
        # These are not authentication/HTTPS evidence for the application.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
