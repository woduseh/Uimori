name: uimori

services:
  app:
    build:
      context: .
      args:
        UIMORI_CODEX_VERSION: ${UIMORI_CODEX_VERSION:-}
    # The updater sets this to the exact candidate reference; the default keeps a local build.
    image: ${UIMORI_IMAGE:-uimori:local}
    # A single process owns this SQLite database and its background workers.
    scale: 1
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env.self-host
    environment:
      NODE_ENV: production
      UIMORI_HOST: 0.0.0.0
      UIMORI_PORT: "4310"
      UIMORI_DB: /data/uimori.sqlite
      UIMORI_PUBLIC_ORIGIN: ${UIMORI_PUBLIC_ORIGIN:?Set the exact HTTPS origin in .env.self-host}
      UIMORI_ACCESS_TOKEN: ${UIMORI_ACCESS_TOKEN:?Set a random access token of at least 32 characters}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - data:/data
    # No host port: HTTPS traffic must enter through the proxy.
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - >-
          const {get} = await import('node:http');
          setTimeout(() => process.exit(1), 3000);
          get('http://127.0.0.1:4310/api/session',
          {headers: {Host: new URL(process.env.UIMORI_PUBLIC_ORIGIN).host}}, response => {
          let body = ''; response.setEncoding('utf8');
          response.on('data', chunk => body += chunk);
          response.on('end', () => { try {
          const session = JSON.parse(body);
          process.exit(response.statusCode === 200 && session.required === true && session.authenticated === false ? 0 : 1);
          } catch { process.exit(1); } });
          }).on('error', () => process.exit(1));
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${UIMORI_HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ./deploy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${UIMORI_TLS_DIR:?Set the absolute directory containing fullchain.pem and privkey.pem}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false

volumes:
  data:
    name: ${UIMORI_DATA_VOLUME:-uimori_data}
