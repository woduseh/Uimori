<script>
'use strict';
const $=id=>document.getElementById(id);
const icon=(name)=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const samples={ko:[
'유리정원의 시계는 비가 그치고도 한동안 늦게 갔다.',
'지윤은 처마 아래에 서서 젖은 소매를 털었다. 문 안쪽에서는 찻잔 두 개가 부딪히는 소리가 났다. 하나는 늘 쓰던 흰 잔이었고, 다른 하나는 찬장 깊숙이 있던 푸른 잔이었다.',
'“오늘은 안 올 줄 알았는데.”',
'서아는 책에서 눈을 떼지 않고 말했다. 펼쳐 둔 페이지의 모서리가 조금 접혀 있었다. 지윤은 그녀가 같은 줄을 두 번 읽었다는 것을 알아차렸지만, 굳이 말하지 않았다.',
'“우산을 빌렸거든. 돌려줘야지.”',
'“그 우산, 네 거잖아.”',
'지윤은 대답 대신 우산을 벽에 기대었다. 서아가 푸른 잔을 테이블 건너편으로 밀었다. 잔 아래에는 접힌 편지가 놓여 있었다. 봉투에 적힌 이름은, 둘 다 오래전에 잊었다고 믿었던 사람의 것이었다.',
'“차가 식기 전에 읽어.”',
'지윤은 의자를 당겼다. 이번에는 돌아갈 시간을 먼저 생각하지 않았다.'
],en:[
'The clock in the glass garden kept running late for a while after the rain had stopped.',
'Jiyun stood beneath the eaves, brushing water from her sleeves. Inside, two teacups touched. One was the familiar white cup; the other was blue, brought down from the back of the cupboard.',
'“I thought you weren’t coming today.”',
'Seoa spoke without looking up from her book. A corner of the open page had folded over. Jiyun noticed that she had read the same line twice, but decided not to mention it.',
'“I borrowed an umbrella. I had to return it.”',
'“That umbrella is yours.”',
'Instead of answering, Jiyun rested the umbrella against the wall. Seoa pushed the blue cup across the table. Beneath it lay a folded letter. The name on the envelope belonged to someone they both believed they had forgotten.',
'“Read it before the tea gets cold.”',
'Jiyun drew out the chair. This time, she did not first consider when she would have to leave.'
]};
let selected='rain',lang='ko',variant=1,screen='chat',libraryTab='봇',activeSetting='appearance',preset='장문 소설',persona='지윤',timer=null,runOwner=null,toastTimer=null;
const drafts={},positions={},extras={},sessions=[{id:'rain',title:'비가 그친 뒤',world:'유리정원의 기록',initial:'서',time:'방금 전'},{id:'train',title:'야간열차의 동행',world:'은빛 철도',initial:'열',time:'어제'},{id:'tower',title:'탑의 마지막 수업',world:'서쪽의 마법사',initial:'탑',time:'2일 전'}];
const categories=['봇','페르소나','로어','창작 프리셋','스킬'];
const cards=[{title:'유리정원의 기록',initial:'서',desc:'오래된 서가에서 다시 만난 두 사람과, 보내지 못한 편지.',tags:['일상','미스터리']},{title:'은빛 철도',initial:'열',desc:'지도에 없는 역으로 향하는 야간열차. 낯선 동행이 기다립니다.',tags:['여행','판타지']},{title:'서쪽의 마법사',initial:'탑',desc:'마법보다 어려운 것은 제자의 질문에 대답하는 일.',tags:['판타지','일상']},{title:'새벽의 관측소',initial:'별',desc:'별이 사라지는 밤, 관측일지에 남은 작은 단서.',tags:['SF','탐사']}];
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3300)}
function saveView(){drafts[selected]=$('briefInput').value;positions[selected]=$('reader').scrollTop}
function sessionInfo(){return sessions.find(s=>s.id===selected)||sessions[0]}
function renderNav(){const html=`<button class="nav-button new-button" data-action="new">${icon('plus')}새 이야기</button><button class="nav-button" data-action="search">${icon('search')}검색<span class="key">Ctrl K</span></button><button class="nav-button ${screen==='library'?'active':''}" data-action="library">${icon('book')}서재</button><div class="nav-section-label">최근 이야기</div><div class="session-list">${sessions.map(s=>`<button class="session ${s.id===selected&&screen==='chat'?'active':''}" data-chat="${s.id}"><span class="avatar">${s.initial}</span><span class="copy"><strong>${esc(s.title)}</strong><small>${esc(s.world)} · ${s.time}</small></span>${s.id===runOwner?'<span class="status-dot" title="작업 중"></span>':''}</button>`).join('')}</div><div class="nav-bottom"><button class="nav-button" data-action="activity">${icon('clock')}작업 현황${runOwner?'<span class="tag">1</span>':''}</button><button class="nav-button ${screen==='settings'?'active':''}" data-action="settings">${icon('settings')}설정</button><div class="prototype-label">Uimori · 인터랙션 시안 01</div></div>`;$('navContent').innerHTML=html;$('navContent').style.cssText='display:flex;flex-direction:column;flex:1;min-height:0';return html}
function setScreen(next,save=true){if(save)saveView();screen=next;document.body.classList.remove('focus-mode');['chat','library','settings'].forEach(x=>$(x+'Screen').classList.toggle('active',next===x));$('headerTitle').textContent=next==='chat'?sessionInfo().title:next==='library'?'서재':'설정';$('headerSubtitle').textContent=next==='chat'?`${sessionInfo().world} · 이어 쓰는 이야기`:next==='library'?'인물 · 세계 · 창작 프리셋':'이 앱에서 사용하는 기본 설정';document.querySelector('.top-actions').style.visibility=next==='chat'?'visible':'hidden';renderNav();if(next==='library')renderLibrary();if(next==='settings')renderSettings();if(next==='chat')requestAnimationFrame(()=>$('reader').scrollTop=positions[selected]||0)}
function changeChat(id){saveView();selected=id;variant=1;$('briefInput').value=drafts[id]||'';setScreen('chat',false);renderTimeline();renderNav();updateRun();$('panel').close()}
function renderTimeline(){const info=sessionInfo(), paragraphs=[...samples[lang]];if(variant===2)paragraphs[paragraphs.length-1]=lang==='ko'?'지윤은 봉투를 뒤집었다. 받는 사람의 이름 아래에, 내일의 날짜가 적혀 있었다.':'Jiyun turned the envelope over. Beneath the recipient’s name was tomorrow’s date.';
if(info.empty&&!extras[selected]?.length){$('timeline').innerHTML=`<div class="empty-state"><span class="brand-mark">u</span><h2>어떤 장면으로 시작할까요?</h2><p>${esc(info.world)}의 이야기예요.<br>장면을 부탁하거나, 첫 대사를 건네세요.</p><button class="secondary" data-action="starter">시작 문장 넣기</button></div>`;return}
$('timeline').innerHTML=`<div class="context-line"><span>${esc(info.world)}</span><span class="dot"></span><span>페르소나 · ${esc(persona)}</span><button class="pill" style="margin-left:auto" data-action="branches">${icon('branch')}전개 ${variant}</button></div><div class="brief"><div class="brief-text"><span class="brief-label">내 장면 요청</span>비가 그친 오후, 서가에서 다시 만나는 장면을 써줘. 말하지 못한 마음은 작은 행동으로 보여줬으면 해.</div></div><article class="story-message"><div class="message-head"><span class="avatar">서</span><div><strong>${esc(info.world)}</strong><small>원고 완료 · 한국어 번역 준비됨</small></div><div class="view-switch" role="group" aria-label="읽는 언어"><button class="${lang==='ko'?'active':''}" data-lang="ko" aria-pressed="${lang==='ko'}">번역</button><button class="${lang==='en'?'active':''}" data-lang="en" aria-pressed="${lang==='en'}">원문</button></div></div><div class="prose"><h2>${lang==='ko'?'비가 그친 뒤':'After the Rain'}</h2>${paragraphs.map((p,i)=>`<p data-anchor="b${i}">${esc(p)}</p>`).join('')}</div><div class="message-foot"><div class="variants"><button data-action="prev-variant" aria-label="이전 후보">${icon('left')}</button><span>${variant} / 2</span><button data-action="next-variant" aria-label="다음 후보">${icon('right')}</button></div><button class="icon" data-action="copy" aria-label="현재 언어의 본문 복사" title="복사">${icon('copy')}</button><button class="icon" data-action="candidate" aria-label="다른 응답 생성" title="다른 응답">${icon('retry')}</button><button class="icon" data-action="message-menu" aria-label="응답 더 보기" title="더 보기">${icon('more')}</button><span class="grow">원문과 번역을 별도로 보관해요</span></div><div class="status-summary row"><span>서가 · 오후 · 조용한 긴장</span><button data-action="status" style="margin-left:auto">장면 상태 보기 →</button></div></article>${(extras[selected]||[]).map((e,i)=>`<div class="divider"></div><div class="brief"><div class="brief-text"><span class="brief-label">내 장면 요청</span>${esc(e.request)}</div></div><article><div class="message-head"><span class="avatar">u</span><div><strong>모의 후속 장면</strong><small>시안 동작 확인용 · 실제 모델 출력이 아니에요</small></div></div><div class="prose"><p>${esc(e.text)}</p></div></article>`).join('')}`}
function renderLibrary(){ $('libraryTabs').innerHTML=categories.map(c=>`<button role="tab" aria-selected="${c===libraryTab}" class="${c===libraryTab?'active':''}" data-library-tab="${c}">${c}</button>`).join('');const q=$('librarySearch').value.toLowerCase();let list=libraryTab==='창작 프리셋'?[{title:'장문 소설',initial:'글',desc:'영어 원고 · 긴 호흡 · 자동 시점',tags:['저장된 조합']},{title:'대화형 RP',initial:'말',desc:'인물의 반응과 대화를 중심으로 이어갑니다.',tags:['저장된 조합']},{title:'이능력 배틀',initial:'빛',desc:'능력과 상황에 집중하는 창작 프리셋 예시.',tags:['목표 UX 예시']}]:libraryTab==='페르소나'?[{title:'지윤',initial:'윤',desc:'여행에서 돌아온, 오래된 편지의 수신인.',tags:['페르소나']},{title:'페르소나 없음',initial:'—',desc:'나를 극중 인물로 설정하지 않고 집필합니다.',tags:['소설']}]:libraryTab==='로어'?[{title:'유리정원 안내',initial:'책',desc:'이 세계의 장소와 인물 관계. 모델이 필요할 때 읽습니다.',tags:['자동 참조']},{title:'작가가 정한 과거',initial:'기',desc:'채팅으로 진행하지 않았어도 유효한 이야기의 전제.',tags:['항상 포함']}]:libraryTab==='스킬'?[{title:'장면의 이미지 연출',initial:'그',desc:'준비된 이미지 중 이 장면에 맞는 자료를 선택합니다.',tags:['보조 모델용']},{title:'한국어 번역',initial:'한',desc:'인물의 목소리와 원문의 의미를 보존하는 번역 지침.',tags:['번역용']}]:cards;
$('libraryCards').innerHTML=list.filter(c=>(c.title+c.desc).toLowerCase().includes(q)).map(c=>`<article class="content-card"><div class="row between"><span class="avatar lg">${c.initial}</span><button class="icon" data-content="${esc(c.title)}" aria-label="${esc(c.title)} 정보">${icon('more')}</button></div><h3>${c.title}</h3><p>${c.desc}</p><div class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><button class="secondary" data-use-content="${esc(c.title)}">${libraryTab==='봇'?'이 봇으로 시작':libraryTab==='창작 프리셋'?'이 프리셋 사용':'내용 보기'}</button></article>`).join('')||'<p class="muted">검색 결과가 없어요.</p>'}
function renderSettings(){document.querySelectorAll('[data-setting]').forEach(b=>b.classList.toggle('active',b.dataset.setting===activeSetting));let html='';if(activeSetting==='appearance')html=`<h2>화면과 읽기</h2><div class="setting-row"><div>테마<small>이 기기에서 편안하게 읽을 색상을 골라요.</small></div><select data-change="theme" aria-label="테마"><option value="dark" ${document.documentElement.dataset.theme==='dark'?'selected':''}>어두운 화면</option><option value="light" ${document.documentElement.dataset.theme==='light'?'selected':''}>밝은 화면</option></select></div><div class="setting-row"><div>본문 크기<small>원문과 번역의 읽기 크기를 함께 바꿔요.</small></div><select data-change="font" aria-label="본문 크기"><option value="17">작게 · 17px</option><option selected value="18">기본 · 18px</option><option value="20">크게 · 20px</option><option value="22">더 크게 · 22px</option></select></div><div class="setting-row"><div>기본 읽기 언어<small>번역이 준비되면 한국어로 읽어요.</small></div><span class="tag">한국어 번역</span></div><div class="notice">화면 설정은 창작 프롬프트나 모델 설정을 변경하지 않아요. 이 시안의 변경은 현재 페이지에서만 유지됩니다.</div>`;
if(activeSetting==='models')html=`<h2>모델과 연결</h2><p class="muted">한 번 연결한 모델을 이야기마다 골라 사용해요.</p><div class="notice">이 HTML은 화면 시안입니다. 실제 API 연결·키 저장·모델 조회 기능은 없어요. 현재 저장소의 fixture 연결을 실제 서비스 지원으로 표시하지 않습니다.</div><div class="provider-card"><div class="row between"><strong>테스트 연결</strong><span class="tag">모의</span></div><p>fixture-sse-v1 · 개발용 연결</p><button class="secondary" data-action="fixture-detail">연결 정보 보기</button></div><button class="secondary" disabled title="실제 공급자 어댑터 구현 후 활성화">공급자 연결 추가</button><div class="divider"></div><h3>역할별 기본 모델</h3>${['원고 작성','한국어 번역','상태 정리','이미지 연출'].map(x=>`<div class="setting-row"><div>${x}</div><span class="tag">연결 없음</span></div>`).join('')}`;
if(activeSetting==='data')html='<h2>데이터와 백업</h2><p class="muted">원고·설정·이미지를 내보내고 복원하는 공간이에요.</p><div class="notice">시안에는 실제 저장 데이터가 없습니다. 백업과 복원 동작은 연결하지 않았어요.</div><div class="setting-row"><div>이야기 내보내기<small>원문·번역·분기와 설정을 함께 보존해요.</small></div><button class="secondary" disabled>내보내기</button></div><div class="setting-row"><div>백업 복원<small>기존 데이터를 덮기 전 내용을 확인해요.</small></div><button class="secondary" disabled>복원</button></div>';

switch(el.dataset.action){case'nav':openPanel('Uimori',`<div class="nav-dialog-body">${renderNav()}</div>`);break;case'close-panel':$('panel').close();break;case'close-modal':$('modal').close();break;case'library':$('panel').close();setScreen('library');break;case'settings':$('panel').close();setScreen('settings');break;case'new':$('panel').close();libraryTab='봇';setScreen('library');break;case'context':contextPanel();break;case'branches':branchPanel();break;case'activity':activityPanel();break;case'focus':document.body.classList.toggle('focus-mode');break;case'presets':openModal('창작 프리셋',`<p class="muted" style="font-size:12px">저장된 조합을 적용해요. 모델과 페르소나는 바뀌지 않아요.</p>${['장문 소설','대화형 RP','이능력 배틀'].map(x=>`<button class="choice ${preset===x?'selected':''}" data-preset="${x}"><span class="avatar">${icon('book')}</span><span><strong>${x}</strong><small>${x==='장문 소설'?'영어 원고 · 긴 호흡 · 자동 시점':x==='대화형 RP'?'인물의 대화와 반응을 중심으로':'능력의 규칙과 반전을 강조하는 예시'}</small></span>${preset===x?`<span class="check">${icon('check')}</span>`:''}</button>`).join('')}`);break;case'persona':openModal('페르소나 선택',`${['지윤','페르소나 없음'].map(x=>`<button class="choice ${persona===x?'selected':''}" data-persona="${x}"><span class="avatar">${x==='지윤'?'윤':'—'}</span><span><strong>${x}</strong><small>${x==='지윤'?'이 이야기에서 나를 나타내는 인물':'인물을 대신 연기하지 않고 작가로 요청해요'}</small></span></button>`).join('')}`);break;case'model':openModal('이 이야기의 모델','<div class="notice">시안에는 실제 모델이 연결되지 않았어요.</div><div class="setting-row"><div>원고 작성</div><span class="tag">연결 없음</span></div><div class="setting-row"><div>한국어 번역</div><span class="tag">연결 없음</span></div><p class="muted" style="font-size:12px;margin-top:18px">실제 앱에서는 저장된 모델을 고르고, 지원되는 추론 강도를 이곳에서 빠르게 바꿉니다. 연결 추가와 API 키 관리는 앱 설정에 있어요.</p>','<button class="secondary" data-action="close-modal">닫기</button><button class="primary" data-action="model-settings">모델 설정 열기</button>');break;case'model-settings':$('modal').close();activeSetting='models';setScreen('settings');break;case'candidate':openModal('다른 응답 만들기','<p>원래 응답을 보존한 채 같은 요청의 다른 전개를 만듭니다.</p><div class="notice">실제 제품에서는 새 모델 호출 비용이 발생해요. 이 시안에서는 미리 준비된 후보로 전환합니다.</div>','<button class="secondary" data-action="close-modal">취소</button><button class="primary" data-action="switch-candidate">시안 후보 보기</button>');break;case'switch-candidate':variant=variant===1?2:1;renderTimeline();$('modal').close();toast('후보 전환 시연이에요. 기존 후보는 보존했어요.');break;case'prev-variant':case'next-variant':variant=variant===1?2:1;renderTimeline();break;case'reading':openPanel('읽기 설정',`<div class="setting-row"><div>본문 크기</div><select data-change="font" aria-label="본문 크기"><option value="17">17px</option><option value="18" selected>18px</option><option value="20">20px</option><option value="22">22px</option></select></div><div class="setting-row"><div>테마</div><select data-change="theme" aria-label="테마"><option value="dark" ${document.documentElement.dataset.theme==='dark'?'selected':''}>어두운 화면</option><option value="light" ${document.documentElement.dataset.theme==='light'?'selected':''}>밝은 화면</option></select></div><div class="notice">읽기 설정은 이 기기의 표시만 바꿔요. 작품 내용과 생성 설정은 유지됩니다.</div>`);break;case'status':openPanel('이 장면의 상태','<p class="muted" style="font-size:12px">현재 원고에 연결된 표시용 정보예요.</p><div class="detail-pair"><span>장소</span><strong>유리정원 서가</strong></div><div class="detail-pair"><span>시간</span><strong>비가 그친 오후</strong></div><div class="detail-pair"><span>등장인물</span><strong>서아 · 지윤</strong></div><div class="detail-pair"><span>분위기</span><strong>조용한 긴장</strong></div><div class="notice">이 시안의 상태는 고정된 모의 자료이며, 다음 이야기의 사실이나 수치를 바꾸지 않습니다.</div>');break;case'diagnostics':openPanel('실행 상세','<span class="tag">개발자용 · 시안</span><h3 style="margin-top:24px">확인할 정보</h3><p class="muted" style="font-size:12px;line-height:1.8">어떤 설정과 자료가 이번 요청에 들어갔는지, 원고와 후속 작업이 어느 버전에 연결됐는지 확인하는 위치입니다.</p><div class="detail-pair"><span>실제 API 호출</span><span>없음</span></div><div class="detail-pair"><span>생성·번역 비용</span><span>측정하지 않음</span></div><div class="notice">프로토타입의 버튼 동작 확인은 실제 앱의 저장·공급자·재접속 검증을 대신하지 않습니다.</div>');break;case'references':openModal('참조 자료',`<p class="muted" style="font-size:12px">이름과 설명으로 자료를 선택해요. ID를 직접 입력하지 않아요.</p>${['인물과 세계의 기본 설정','오래된 편지의 기록','서가의 방문객들'].map((x,i)=>`<label class="choice"><input type="checkbox" checked><span><strong>${x}</strong><small>${i===0?'항상 포함':'모델이 필요할 때 읽기'}</small></span></label>`).join('')}`,'<button class="secondary" data-action="close-modal">취소</button><button class="primary" data-action="save-references">선택 적용</button>');break;case'save-references':$('modal').close();toast('참조 자료 선택 동작의 시안입니다. 실제 저장은 수행하지 않아요.');break;case'apply-context':$('panel').close();toast('설정 패널 저장 위치의 시안이에요. 실제 요청 설정은 바뀌지 않았어요.');break;case'message-menu':openModal('이 응답',`<button class="nav-button" data-action="retranslate">${icon('retry')}다시 번역하기</button><button class="nav-button" data-action="branches">${icon('branch')}여기서 다른 전개 보기</button><button class="nav-button" data-action="diagnostics">${icon('sliders')}실행 상세</button><button class="nav-button" data-action="mismatch">${icon('book')}요청과 다른 응답으로 표시</button>`);break;case'retranslate':$('modal').close();toast('실제 앱에서는 원문을 재생성하지 않고 번역만 다시 요청해요. 시안에서는 호출하지 않습니다.');break;case'mismatch':$('modal').close();toast('요청 불일치 표시 위치의 시안이에요. 원문은 삭제하지 않았어요.');break;case'search':openModal('이야기 검색','<input id="storySearch" style="width:100%;margin-bottom:15px" placeholder="이야기 이름으로 검색" aria-label="이야기 검색"><div id="searchResults">'+sessions.map(s=>`<button class="nav-button" data-search-chat="${s.id}">${icon('book')}${esc(s.title)}</button>`).join('')+'</div>');setTimeout(()=>$('storySearch')?.focus(),10);break;case'start-story':{const title=$('newTitle').value.trim()||'새 이야기';const id='demo-'+Date.now();sessions.unshift({id,title,world:$('modal').dataset.world||'새로운 세계',initial:'새',time:'방금 전',empty:true});$('modal').close();changeChat(id);break}case'create-content':openModal('새 자료','<div class="notice">실제 제품의 자료 편집기는 이곳에서 열립니다. 이 시안은 서버에 자료를 저장하지 않습니다.</div><div class="field">자료 이름<input placeholder="새 자료의 이름"></div><div class="field">본문<textarea rows="5" placeholder="인물이나 세계의 설정을 적어요."></textarea></div>');break;case'fixture-detail':toast('fixture-sse-v1 · 로컬 개발용 모의 연결');break;case'starter':$('briefInput').value='(OOC: 두 인물이 처음 만나는 장면을 써줘.)';$('briefInput').focus();break;case'latest':$('reader').scrollTo({top:$('reader').scrollHeight,behavior:'smooth'});$('newOutput').hidden=true;break;case'copy':{const text=[...$('timeline').querySelectorAll('.prose p')].map(e=>e.innerText).join('\n\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('현재 읽는 언어의 본문을 복사했어요.')).catch(()=>toast('이 환경에서는 자동 복사가 제한돼요. 본문을 선택해 복사해주세요.'));else toast('본문을 선택해 복사해주세요. 이 환경은 자동 복사를 지원하지 않아요.');break}}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-search-chat]');if(b){$('modal').close();changeChat(b.dataset.searchChat)}});
document.addEventListener('input',e=>{if(e.target.id==='storySearch'){const q=e.target.value.toLowerCase();$('searchResults').innerHTML=sessions.filter(s=>(s.title+s.world).toLowerCase().includes(q)).map(s=>`<button class="nav-button" data-search-chat="${s.id}">${icon('book')}${esc(s.title)}</button>`).join('')||'<p class="muted">검색 결과가 없어요.</p>'}});
document.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&e.target.id==='briefInput'){e.preventDefault();simulate()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('[data-action=search]').click()}if(e.key==='Escape'&&!$('modal').open&&!$('panel').open)document.body.classList.remove('focus-mode')});
// Native dialog keeps keyboard focus inside the opened overlay. Clicking its backdrop closes it.
for(const d of [$('panel'),$('modal')])d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}});
renderNav();renderTimeline();updateRun();
</script>
</body></html>
